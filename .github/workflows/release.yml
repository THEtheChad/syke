name: Release

# On every push to main, semantic-release reads the Conventional Commits since
# the last tag and, if any call for a release (feat, fix, perf or a breaking
# change), publishes to npm, tags vX.Y.Z and creates a GitHub release. npm
# authenticates through trusted publishing (OIDC), so no npm token is stored
# anywhere, and npm adds a provenance attestation.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # push the tag and create the GitHub release
      issues: write # comment on issues fixed by the release
      pull-requests: write # comment on pull requests in the release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `pnpm check` already ran; skip it again in prepublishOnly.
          npm_config_ignore_scripts: 'true'
